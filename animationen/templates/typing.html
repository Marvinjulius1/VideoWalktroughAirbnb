<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .field {
    position: absolute; left: 60px; right: 60px; top: 50%;
    min-height: 150px; padding: 34px 150px 34px 56px;
    background: #1c1c1e; border: 3px solid #3a3a3c; border-radius: 75px;
    font-size: 50px; font-weight: 500; letter-spacing: -0.6px; line-height: 1.3;
    transform: translateY(-50%);
  }
  body.green .field { background: #1c1c1e; }
  .ph { color: #636366; }
  .caret { display: inline-block; width: 5px; height: 60px; background: var(--blue); vertical-align: -10px; margin-left: 3px; border-radius: 3px; }
  .send {
    position: absolute; right: 24px; bottom: 24px; width: 102px; height: 102px; border-radius: 50%;
    background: #3a3a3c; display: flex; align-items: center; justify-content: center;
  }
  .send svg { width: 54px; height: 54px; }
  .bubble {
    position: absolute; right: 60px; max-width: 820px; padding: 32px 46px;
    background: var(--blue); border-radius: 56px; font-size: 50px; font-weight: 500;
    letter-spacing: -0.6px; line-height: 1.3; opacity: 0;
  }
</style></head>
<body>
<div class="field" id="field"><span id="txt"></span><span class="caret" id="caret"></span>
  <div class="send" id="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<div class="bubble" id="bubble"></div>
<script src="lib.js"></script>
<script>
  // Params: text, placeholder, cps (characters per second), send (1|0)
  const text = param("text", "How do the 1% invest their money?");
  const placeholder = param("placeholder", "Ask anything");
  const cps = num("cps", 16), withSend = param("send", "1") === "1";
  const T0 = 0.8, T1 = T0 + text.length / cps;
  window.DURATION = T1 + (withSend ? 2.2 : 1.2);
  $("#bubble").textContent = text;

  window.render = (t) => {
    const n = Math.floor(clamp((t - T0) * cps, 0, text.length));
    const txt = $("#txt");
    if (n === 0) { txt.textContent = placeholder; txt.className = "ph"; }
    else { txt.textContent = text.slice(0, n); txt.className = ""; }
    // Caret blinks only while idle, solid while typing.
    const typing = t >= T0 && t <= T1 + 0.1;
    $("#caret").style.opacity = typing || Math.floor(t * 2) % 2 === 0 ? 1 : 0;
    if (n === 0) $("#caret").style.display = "none"; else $("#caret").style.display = "inline-block";
    $("#send").style.background = n > 0 ? "#0a84ff" : "#3a3a3c";
    if (!withSend) return;
    // Send: bubble flies up out of the field, field empties.
    const s = prog(t, T1 + 0.5, T1 + 1.0);
    const press = 1 - 0.15 * Math.sin(Math.PI * prog(t, T1 + 0.3, T1 + 0.55));
    $("#send").style.transform = `scale(${press})`;
    if (s > 0) {
      txt.textContent = placeholder; txt.className = "ph"; $("#caret").style.display = "none";
      $("#send").style.background = "#3a3a3c";
      const b = $("#bubble");
      const k = ease.outBack(s);
      b.style.opacity = clamp(s * 3);
      const fieldTop = $("#field").getBoundingClientRect().top;
      b.style.top = `${lerp(fieldTop, fieldTop - 260, k)}px`;
      b.style.transform = `scale(${lerp(0.85, 1, clamp(k))})`;
      b.style.transformOrigin = "100% 100%";
    }
  };
</script>
</body></html>
