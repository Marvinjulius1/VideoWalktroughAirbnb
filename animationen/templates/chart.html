<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .head { position: absolute; left: 90px; right: 90px; top: 520px; }
  .name { font-size: 56px; font-weight: 700; letter-spacing: -1px; }
  .desc { font-size: 34px; font-weight: 500; color: var(--muted); margin-top: 6px; }
  .price { font-size: 120px; font-weight: 700; letter-spacing: -4px; margin-top: 30px; }
  .chg { font-size: 44px; font-weight: 600; margin-top: 8px; }
  svg { position: absolute; left: 0; top: 900px; }
  .axis { font-size: 28px; fill: var(--muted); font-weight: 500; }
</style></head>
<body>
<div class="head">
  <div class="name" id="name"></div>
  <div class="desc" id="desc"></div>
  <div class="price" id="price"></div>
  <div class="chg" id="chg"></div>
</div>
<svg width="1080" height="640" viewBox="0 0 1080 640">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" id="s0" stop-opacity="0.35"/>
      <stop offset="1" id="s1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="reveal"><rect id="clip" x="0" y="0" width="0" height="640"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="grid"></g>
  <g clip-path="url(#reveal)">
    <path id="area" fill="url(#fill)"/>
    <path id="line" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <circle id="dot" r="14"/>
  <circle id="halo" r="14" fill="none" stroke-width="4"/>
</svg>
<script src="lib.js"></script>
<script>
  // Params: name, desc, start, end, trend (up|down), seed, labels (comma list)
  const start = num("start", 100), end = num("end", 1947);
  const up = param("trend", end >= start ? "up" : "down") === "up";
  const color = up ? "#30d158" : "#ff453a";
  $("#name").textContent = param("name", "S&P 500");
  $("#desc").textContent = param("desc", "1990 – 2024");
  ["s0", "s1"].forEach((id) => $("#" + id).setAttribute("stop-color", color));
  $("#line").setAttribute("stroke", color);
  $("#dot").setAttribute("fill", color);
  $("#halo").setAttribute("stroke", color);
  $("#chg").style.color = color;

  // Random walk that ends exactly at `end`, with realistic dips on the way.
  const N = 160, rand = rng(num("seed", 7));
  let pts = [0];
  for (let i = 1; i < N; i++) pts.push(pts[i - 1] + (rand() - 0.5) * 1.6 + (rand() < 0.04 ? -3 : 0));
  const drift = pts.map((v, i) => v - (pts[N - 1] * i) / (N - 1));
  const span = Math.max(...drift) - Math.min(...drift) || 1;
  const vals = drift.map((d, i) => start + (end - start) * Math.pow(i / (N - 1), up ? 1.6 : 0.8) + (d / span) * Math.abs(end - start) * 0.18);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const X = (i) => 60 + (i / (N - 1)) * 960;
  const Y = (v) => 600 - ((v - lo) / (hi - lo)) * 560;
  const d = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  $("#line").setAttribute("d", d);
  $("#area").setAttribute("d", `${d} L${X(N - 1)} 640 L${X(0)} 640 Z`);
  // Dotted gridlines like the Stocks app.
  $("#grid").innerHTML = [0, 1, 2, 3].map((k) => `<line x1="60" x2="1020" y1="${40 + k * 186}" y2="${40 + k * 186}" stroke="#2c2c2e" stroke-width="2" stroke-dasharray="4 10"/>`).join("");

  const DRAW = num("dur", 3.4);
  window.DURATION = DRAW + 1.6;
  const pct = ((end - start) / start) * 100;

  window.render = (t) => {
    const intro = ease.outCubic(prog(t, 0, 0.5));
    $(".head").style.opacity = intro;
    $(".head").style.transform = `translateY(${(1 - intro) * 30}px)`;
    const k = ease.inOutCubic(prog(t, 0.3, 0.3 + DRAW));
    const idx = Math.min(N - 1, Math.floor(k * (N - 1)));
    const frac = k * (N - 1) - idx;
    const v = idx < N - 1 ? lerp(vals[idx], vals[idx + 1], frac) : vals[N - 1];
    const x = 60 + k * 960;
    $("#clip").setAttribute("width", x + 4);
    $("#dot").setAttribute("cx", x); $("#dot").setAttribute("cy", Y(v));
    $("#halo").setAttribute("cx", x); $("#halo").setAttribute("cy", Y(v));
    $("#dot").style.opacity = prog(t, 0.3, 0.45);
    // Pulse ring once the line arrives.
    const pulse = prog(t, 0.3 + DRAW, 1.2 + DRAW);
    $("#halo").setAttribute("r", 14 + pulse * 40);
    $("#halo").style.opacity = pulse > 0 ? 1 - pulse : 0;
    const shown = lerp(start, v, 1) ;
    $("#price").textContent = "$" + fmt(shown, 2);
    const p = ((shown - start) / start) * 100;
    $("#chg").textContent = `${p >= 0 ? "+" : ""}${fmt(p, 2)}%`;
  };
</script>
</body></html>
