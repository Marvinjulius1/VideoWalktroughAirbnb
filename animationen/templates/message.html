<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .note {
    position: absolute; left: 36px; right: 36px; top: 150px;
    background: rgba(58, 58, 60, 0.92); border-radius: 58px;
    display: flex; align-items: flex-start; padding: 40px 44px 44px; gap: 32px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45);
    -webkit-backdrop-filter: blur(30px);
  }
  body.green .note { background: #3a3a3c; box-shadow: none; }
  .icon { flex: none; width: 116px; height: 116px; border-radius: 27px; overflow: hidden; margin-top: 4px; }
  .icon svg { display: block; width: 100%; height: 100%; }
  .txt { flex: 1; min-width: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  .title { font-size: 44px; font-weight: 600; letter-spacing: -0.4px; }
  .time { font-size: 34px; color: #a1a1a6; font-weight: 500; flex: none; }
  .body { font-size: 43px; line-height: 1.24; color: #f2f2f7; margin-top: 6px; letter-spacing: -0.3px; }
</style></head>
<body>
<div class="note" id="note">
  <div class="icon" id="icon"></div>
  <div class="txt">
    <div class="row"><div class="title" id="title"></div><div class="time" id="time"></div></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script src="lib.js"></script>
<script>
  // Params: app (whatsapp|imessage), sender, text, time, top (px), hold (s)
  const ICONS = {
    whatsapp: `<svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5df777"/><stop offset="1" stop-color="#1ec43f"/></linearGradient></defs>
      <rect width="100" height="100" fill="url(#g)"/>
      <path d="M50 21a28 28 0 0 0-24.2 42.1L22 77l14.3-3.7A28 28 0 1 0 50 21z" fill="none" stroke="#fff" stroke-width="5.2" stroke-linejoin="round"/>
      <path d="M40.3 35.6c-.8-1.7-1.6-1.8-2.4-1.8h-2c-.7 0-1.8.3-2.8 1.3s-3.6 3.5-3.6 8.6 3.7 10 4.2 10.7 7.2 11.5 17.8 15.6c8.8 3.5 10.6 2.8 12.5 2.6s6.2-2.5 7-5 .9-4.6.6-5c-.2-.4-.9-.7-1.9-1.2s-6.2-3-7.1-3.4-1.7-.5-2.4.5-2.7 3.4-3.3 4.1-1.2.8-2.3.3-4.4-1.6-8.4-5.2c-3.1-2.8-5.2-6.2-5.8-7.2s-.1-1.6.4-2.1c.5-.5 1-1.2 1.6-1.8s.7-1 1-1.7.2-1.3-.1-1.8-2.1-5.3-3-7.1z" fill="#fff"/></svg>`,
    imessage: `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#30d158"/>
      <ellipse cx="50" cy="47" rx="30" ry="25" fill="#fff"/><path d="M28 62 L22 76 L40 68 Z" fill="#fff"/></svg>`,
  };
  $("#icon").innerHTML = ICONS[param("app", "whatsapp")] || ICONS.whatsapp;
  $("#title").textContent = param("sender", "Hendrik");
  $("#body").textContent = param("text", "Mit 100€ im Monat kannst du nicht reich werden.");
  $("#time").textContent = param("time", "jetzt");
  $("#note").style.top = num("top", 150) + "px";

  // Params (cont.): out (1 = fly back up at the end, 0 = stay)
  const IN = 0.4, HOLD = num("hold", 2.5), OUT = num("out", 1) ? 0.45 : 0;
  const T_OUT = IN + 0.7 + HOLD;
  window.DURATION = T_OUT + OUT + (OUT ? 0.25 : 0);

  window.render = (t) => {
    // iOS-style drop from above the screen edge with a soft spring.
    const k = ease.outBack(prog(t, IN, IN + 0.65));
    // Then it slides back up, accelerating like a dismissed banner.
    const o = OUT ? Math.pow(prog(t, T_OUT, T_OUT + OUT), 2.2) : 0;
    const el = $("#note");
    el.style.opacity = clamp(prog(t, IN, IN + 0.18)) * (1 - clamp(prog(t, T_OUT + OUT * 0.6, T_OUT + OUT)));
    el.style.transform = `translateY(${(1 - k) * -420 - o * 520}px) scale(${lerp(0.9, 1, clamp(k)) - o * 0.04})`;
  };
</script>
</body></html>
